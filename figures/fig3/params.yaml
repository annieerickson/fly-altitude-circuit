      data_df_dir: two_photon_dna10_width
    arguments:
      pattern_dict:
        1.0: '36 deg

          azimuth'
        3.0: '72 deg

          azimuth'
        5.0: '108 deg

          azimuth'
        7.0: '144 deg

          azimuth'
        9.0: '180 deg

          azimuth'
        11.0: '216 deg


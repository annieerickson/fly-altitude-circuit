      alpha_patch: 1.0
      alpha_CI: 0.5
      include_visual_patch: true
      line_width: 0.5
      axis_ticklabel_fontsize: 6
      axis_label_fontsize: 6
    statistics_only_supported: false
    retain: null
    export_format: svg
    transparent: true
  fig3G:

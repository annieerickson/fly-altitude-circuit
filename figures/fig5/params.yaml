    datasets:
      data_df_dir: two_photon_lpt49_panel
    arguments:
      patterns_to_plot: &id001
        -2.0: Pitch Up
        -5.5: Upward
        -3.0: Yaw left
        3.0: Yaw right
        2.0: Pitch Down
        5.5: Downward
      line: '2075'
      flying_threshold_default: 0.14
      seconds_pre: 0.5
      seconds_post: 1
      airpuff_threshold: 2.0
      plot_bs_CI: true
      air_puff_pre_s: 1
      axis_label_fontsize: 6
      axis_ticklabel_fontsize: 6
      label_pad: 0
      line_width: 0.25
      alpha_CI: 0.3
      alpha_patch: 1.0
      dff_row: 0
      LRwing_row: 1
      interp_to: median
      quiescence: false
      color_dff: '#3379b5'
    statistics_only_supported: false
    retain: null
    export_format: svg
    transparent: false
  fig5C_bottom:
    canvas_padding_in: {left: 0.2, right: 0.05, bottom: 0.2, top: 0.2}
    function: plot_avg_trace_per_visual_stimulus_updown_experiment_combine_yaw_avg_roi_LpR_only_rescaled
    datasets:
      data_df_dir: two_photon_lpt27_panel

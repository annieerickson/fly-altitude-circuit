    plot:
      label: Top visual inputs
      fig_size: [2.4015748033333333, 2.50984252125]
      set_color_max: null
  fig5D:
    dataset: connectomics_manc
    statistics_only_supported: false
    analysis: {top_cells: 10}
    plot:
      label: Top outputs in VNC
      fig_size: [2.4015748033333333, 2.50984252125]
      set_color_max: null
  fig5C_top:
    canvas_padding_in: {left: 0.2, right: 0.05, bottom: 0.2, top: 0.2}
